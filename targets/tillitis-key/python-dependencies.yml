# Python package dependencies for the Tillitis Key QEMU-native build target.
#
# The firmware and QEMU builds are driven by Makefiles; only pytest is
# needed for running Python-based tests.

profiles:
  minimal:
    packages: []

  docs:
    packages:
      - sphinx
      - sphinx-rtd-theme
      - myst-parser

  dev:
    packages:
      - pytest

  full:
    packages:
      - pytest
      - black
      - flake8

default: dev
